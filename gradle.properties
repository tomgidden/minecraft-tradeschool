# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft
minecraft_version=26.3

# Fabric
fabric_loader_version=0.19.5
fabric_loom_version=1.17-SNAPSHOT
fabric_api_version=0.161.0+26.3

# NeoForge
neoforge_version=26.3.0.8-beta
neoforge_moddev_version=2.0.147

# Mod
mod_version=26.0.3-beta1
# mod_id is the registry id, baked into saved worlds and depended on by
# other mods -- never change it. archives_base_name is just the jar filename.
mod_id=tradeschool
mod_name=Trade School
mod_group=cx.gid.minecraft
archives_base_name=tradeschool

# Minimum versions the mod declares support for, templated into
# fabric.mod.json and neoforge.mods.toml so the ranges live in one place.
minecraft_version_min=26.3
neoforge_version_min=26.3.0.4-beta
