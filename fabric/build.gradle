plugins {
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

sourceSets {
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    mods {
        // The mod is two source sets: this project holds the loader entrypoint and
        // tradeschool.mixins.json, while every class that config names lives in :common.
        // Loom needs telling, or it treats mod "tradeschool" as this project alone and the
        // dev run gets the mixin config without the mixins. Together with :common's jar
        // being enabled (see common/build.gradle), this is what makes runGameTestServer
        // work; either one alone is not enough.
        "tradeschool" {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
        "tradeschool-gametest" { sourceSet sourceSets.gametest }
    }

    runs {
        gameTestServer {
            server()
            name "Game Test Server"
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation project(':common')

    // fabric-gametest-api-v1 is bundled inside fabric-api -- no extra dependency needed
}

processResources {
    def props = [
        version: project.version,
        mod_id: project.mod_id,
        mod_name: project.mod_name,
        minecraft_version_min: project.minecraft_version_min,
        fabric_loader_version: project.fabric_loader_version
    ]
    inputs.properties props
    filesMatching("fabric.mod.json") { expand props }
}

jar {
    from(project(':common').sourceSets.main.output)
    def baseName = base.archivesName.get()
    from('../LICENSE.txt') { rename { "${it}_${baseName}" } }
}
