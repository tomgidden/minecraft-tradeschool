plugins {
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

sourceSets {
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    mods {
        "tradeschool" { sourceSet sourceSets.main }
        "tradeschool-gametest" { sourceSet sourceSets.gametest }
    }

    runs {
        gameTestServer {
            server()
            name "Game Test Server"
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation project(':common')

    // fabric-gametest-api-v1 is bundled inside fabric-api — no extra dependency needed
}

processResources {
    def props = [
        version: project.version,
        mod_id: project.mod_id,
        mod_name: project.mod_name,
        minecraft_version: project.minecraft_version,
        fabric_loader_version: project.fabric_loader_version
    ]
    inputs.properties props
    filesMatching("fabric.mod.json") { expand props }
}

jar {
    from(project(':common').sourceSets.main.output)
    def baseName = base.archivesName.get()
    from('../LICENSE.txt') { rename { "${it}_${baseName}" } }
}
