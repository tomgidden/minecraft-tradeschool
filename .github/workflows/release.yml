name: Publish Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  MINECRAFT_VERSION: 1.21.11
  JAVA_VERSION: 21

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Run Tests
        run: ./gradlew check

  publish:
    name: Publish to Platforms
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build

      - name: Publish to Modrinth, CurseForge & GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # Modrinth Publishing
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true

          # CurseForge Publishing
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # GitHub Releases
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}

          # Files to Upload
          files: |
            fabric/build/libs/!(*-dev|*-sources).jar

          # Version Information
          name: "TradeSchool ${{ github.ref_name }}"
          version: ${{ github.ref_name }}
          version-type: release
          changelog-file: CHANGELOG.md

          # Game Version & Loader
          loaders: fabric
          game-versions: ${{ env.MINECRAFT_VERSION }}
          java: ${{ env.JAVA_VERSION }}

          # Dependencies
          dependencies: |
            architectury-api | depends | *
            fabric-api | depends | * {modrinth:P7dR8mSH, curseforge:306612}

          # Retry Configuration
          retry-attempts: 2
          retry-delay: 10000
          fail-mode: fail
