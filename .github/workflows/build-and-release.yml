name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # NeoForge's NFRT toolchain (downloaded/decompiled/patched Minecraft) and
      # Loom's own cache are expensive to rebuild but only change when the
      # pinned MC/loader/NeoForge versions do -- not on every source change --
      # so they're cached separately from setup-gradle's build-cache, keyed on
      # gradle.properties rather than the whole repo.
      - name: Cache NeoForge/Loom toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/neoformruntime
            ~/.gradle/caches/fabric-loom
            .gradle/loom-cache
          key: toolchains-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: |
            toolchains-${{ runner.os }}-

      - name: Build
        run: ./gradlew :fabric:build :neoforge:build

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Trade School ${{ github.ref_name }}
          body: |
            **Minecraft 26.x | Fabric and NeoForge**

            Proof-of-concept of an alternative Villager Trading mechanic using a teaching system, to encourage exploration and reduce random grind. Teach librarians, weaponsmiths, toolsmiths, armourers, and fletchers by selling them enchanted items — they'll learn and resell what you teach!

            Install one of these to your server's `mods/` folder (or run Open To LAN on a singleplayer world)

            - `tradeschool-fabric-${{ github.ref_name }}.jar` — Fabric (requires Fabric API)
            - `tradeschool-neoforge-${{ github.ref_name }}.jar` — NeoForge

            The Fabric version requires [Fabric API](https://modrinth.com/mod/fabric-api).

            TL;DR:

            1. Find a decent enchanted book, enchanted weapon, armour, or even just make a basic pickaxe;
            2. Hold it and right-click a suitable Villager (eg. Weaponsmith, Librarian, etc.) and sell it to them
            3. The Villager should now be able to sell identical items; however, if they are low-skill eg. novice, it will limit the materials and enchantments they can make.

          files: |
            fabric/build/libs/tradeschool-fabric-${{ github.ref_name }}.jar
            neoforge/build/libs/tradeschool-neoforge-${{ github.ref_name }}.jar
          fail_on_unmatched_files: true
          # This is a proof-of-concept, so releases are flagged as
          # pre-releases: GitHub keeps them out of the "Latest release"
          # slot and marks them accordingly.
          prerelease: true

      # Loaders, game versions and dependencies are read out of the jars'
      # own metadata (fabric.mod.json / neoforge.mods.toml), so there is
      # nothing to keep in step here when the MC version moves.
      #
      # Skipped unless MODRINTH_TOKEN is set, so a fork or a local
      # workflow_dispatch still builds and makes a GitHub release.
      - name: Publish to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: |
            fabric/build/libs/tradeschool-fabric-${{ github.ref_name }}.jar
            neoforge/build/libs/tradeschool-neoforge-${{ github.ref_name }}.jar
          name: Trade School ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          # Matches the GitHub pre-release flag above: Modrinth's equivalent
          # of a pre-release is a beta version channel.
          version-type: beta
          changelog: |
            Proof-of-concept of an alternative Villager Trading mechanic using a teaching system, to encourage exploration and reduce random grind. Teach librarians, weaponsmiths, toolsmiths, armourers, and fletchers by selling them enchanted items — they'll learn and resell what you teach!

            See https://github.com/tomgidden/minecraft-tradeschool/releases/tag/${{ github.ref_name }}
